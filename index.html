<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K3 Daily</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --blue:   #1E2D54;
  --gold:   #D1A771;
  --bg:     #EEF1F8;
  --white:  #FFFFFF;
  --s1:     #F8F9FC;
  --s2:     #F1F4FA;
  --s3:     #E8EDF5;
  --hov:    #E5EBFF;
  --border: rgba(30,45,84,.10);
  --tx:     #1E2D54;
  --tx2:    #5B6F9E;
  --tx3:    #94A3C0;
  --ok:     #15803D;
  --ko:     #B91C1C;
  --warn:   #92400E;
  --ok-bg:  rgba(21,128,61,.08);
  --ko-bg:  rgba(185,28,28,.06);
  --f:      'Inter','Segoe UI',sans-serif;
  --fd:     'JetBrains Mono','Consolas',monospace;
  --fh:     'Barlow Condensed','Montserrat',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px;line-height:1.5}

/* ── header ─────────────────────────────────────── */
header{
  background:var(--blue);border-bottom:2px solid var(--gold);
  padding:0 28px;display:flex;align-items:center;gap:14px;height:52px;
  position:sticky;top:0;z-index:100;
}
.logo{font-family:var(--fh);font-weight:700;font-size:20px;letter-spacing:.06em;color:var(--gold);display:flex;align-items:center;gap:8px}
.logo-sep{width:1px;height:18px;background:rgba(209,167,113,.3)}
.logo-sub{font-family:var(--f);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbadge{font-size:10px;font-weight:500;padding:3px 10px;border-radius:3px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);font-family:var(--fd);letter-spacing:.04em}
.hbadge.ok  {border-color:rgba(21,128,61,.5);color:#86efac}
.hbadge.warn{border-color:rgba(146,64,14,.5);color:#fcd34d}
.hbadge.ko  {border-color:rgba(185,28,28,.5);color:#fca5a5}
.hbadge.date{color:var(--gold);border-color:rgba(209,167,113,.3)}

/* ── tabs ───────────────────────────────────────── */
nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;display:flex}
.tab{padding:11px 20px;font-size:10px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;
  color:var(--tx3);cursor:pointer;border:none;background:none;font-family:var(--f);
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab:hover{color:var(--tx2)}
.tab.active{color:var(--blue);border-bottom-color:var(--gold)}
.panel{display:none;padding:24px 28px 60px}
.panel.active{display:block}

/* ── hero strip ─────────────────────────────────── */
.hero-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.hero-card{
  background:var(--white);border:1px solid var(--border);border-radius:8px;
  padding:18px 20px 14px;border-left:4px solid var(--gold);
}
.hero-eyebrow{font-family:var(--f);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:8px}
.hero-val{font-family:var(--fh);font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1;color:var(--tx)}
.hero-val.ok  {color:var(--ok)}
.hero-val.warn{color:#92400E}
.hero-val.ko  {color:var(--ko)}
.hero-meta{font-family:var(--f);font-size:11px;color:var(--tx2);margin-top:6px}
.hero-meta b{color:var(--blue);font-weight:700}
.hero-bar-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.hero-track{flex:1;height:4px;background:rgba(30,45,84,.08);border-radius:2px;overflow:hidden}
.hero-fill{height:100%;border-radius:2px}
.hero-fill.ok  {background:var(--ok)}
.hero-fill.warn{background:#D97706}
.hero-fill.ko  {background:var(--ko)}
.hero-fill.gold{background:var(--gold)}
.hero-pct{font-size:11px;font-weight:500;font-family:var(--fd);color:var(--tx2);min-width:32px;text-align:right}

/* ── team selector ──────────────────────────────── */
.team-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.team-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-right:6px}
.pill{
  padding:4px 14px;border-radius:4px;border:1.5px solid var(--border);
  font-size:11px;font-weight:600;letter-spacing:.03em;cursor:pointer;font-family:var(--f);
  background:transparent;color:var(--tx2);transition:all .12s;
}
.pill:hover{border-color:var(--blue);color:var(--blue)}
.pill.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* ── legend ─────────────────────────────────────── */
.legend{display:flex;gap:16px;margin-bottom:10px;font-size:10px;color:var(--tx3);font-weight:600;letter-spacing:.04em}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-icon{font-size:9px;color:var(--tx3)}

/* ── table ──────────────────────────────────────── */
.table-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;overflow-x:auto;background:var(--white)}
.kt{width:100%;border-collapse:collapse;min-width:640px}

.kt thead th{
  background:var(--blue);padding:9px 14px;color:rgba(255,255,255,.65);
  font-family:var(--f);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap;
}
.kt thead th.r{text-align:right}
.kt thead th.c{text-align:center}

/* row families */
.kt tr.r0 td{padding:11px 14px;background:var(--white);border-bottom:1px solid var(--border);vertical-align:middle}
.kt tr.r0{cursor:pointer}
.kt tr.r0:hover td{background:var(--hov)}

/* assessor mode: gold left border on parent */
.kt tr.r0.open-a>td:first-child{border-left:3px solid var(--gold)}
/* product mode: chevron rotates */
.kt tr.r0.open-p .chev-p,.kt tr.r1.open-p .chev-p{transform:rotate(90deg)}
.kt tr.r0.open-a .chev-p,.kt tr.r1.open-a .chev-p{color:var(--gold)}

.kt tr.r1{cursor:pointer}
.kt tr.r1 td{padding:9px 14px 9px 32px;background:var(--s1);border-bottom:1px solid var(--border);vertical-align:middle}
.kt tr.r1:hover td{background:var(--hov)}
.kt tr.r1.open-a>td:first-child{border-left:2px solid rgba(209,167,113,.5)}

.kt tr.r2{cursor:pointer}
.kt tr.r2 td{padding:8px 14px 8px 50px;background:var(--s2);border-bottom:1px solid rgba(30,45,84,.05);vertical-align:middle}
.kt tr.r2:hover td{background:var(--hov)}
.kt tr.r2.open-a>td:first-child{border-left:2px solid rgba(209,167,113,.3)}

/* assessor row */
.kt tr.ra td{padding:7px 14px 7px 40px;background:var(--s2);border-bottom:1px solid rgba(30,45,84,.05);vertical-align:middle;cursor:default}
.kt tr.ra[data-has-detail="1"]{cursor:pointer}
.kt tr.ra[data-has-detail="1"]:hover td{background:var(--s3)}
.kt tr.ra.open-a>td:first-child{border-left:2px solid rgba(209,167,113,.25)}

/* assessor detail (sub-product per assessor) */
.kt tr.ra-detail td{padding:6px 14px 6px 60px;background:var(--s3);border-bottom:1px solid rgba(30,45,84,.04);vertical-align:middle}

.kt tr.hidden{display:none}

/* labels */
.lbl{display:flex;align-items:center;gap:7px}
.chev-p{width:14px;height:14px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--tx3);transition:transform .18s;cursor:pointer}
.kname {font-family:var(--f);font-weight:600;font-size:13px;letter-spacing:.01em;color:var(--tx)}
.sname {font-family:var(--f);font-weight:500;font-size:12px;color:var(--tx2)}
.ssname{font-family:var(--f);font-weight:500;font-size:11px;color:var(--tx3)}
.aname {font-family:var(--f);font-size:12px;font-weight:500;color:var(--tx2)}
.a-dot {width:5px;height:5px;border-radius:50%;background:var(--tx3);flex-shrink:0}
.mode-hint{font-size:9px;color:var(--tx3);font-weight:500;margin-left:4px;
  background:rgba(30,45,84,.06);padding:1px 6px;border-radius:10px;white-space:nowrap}

/* value cells */
.vn{text-align:right;font-family:var(--fd);font-size:13px;white-space:nowrap;color:var(--tx)}
.vn.pos{color:var(--ok);font-weight:600}
.vn.neg{color:var(--ko);font-weight:600}
.vn.dim{color:var(--tx2)}
.vn.sm{font-size:11px}

.meta-cell{text-align:right;font-family:var(--fd);font-size:12px;color:var(--tx3);white-space:nowrap;min-width:80px}
.pct-cell{text-align:right;font-family:var(--fd);font-size:12px;white-space:nowrap;width:54px;color:var(--tx2)}
.pct-cell.ok  {color:var(--ok);font-weight:600}
.pct-cell.warn{color:#92400E;font-weight:600}
.pct-cell.ko  {color:var(--ko);font-weight:600}
.proj-cell{text-align:right;font-family:var(--fd);font-size:12px;font-weight:600;white-space:nowrap;width:64px;color:var(--tx3)}
.proj-cell.ok  {color:var(--ok)}
.proj-cell.warn{color:#92400E}
.proj-cell.ko  {color:var(--ko)}

/* progress bar */
.bar-col{width:130px;padding:0 12px !important}
.bar-outer{position:relative;height:7px}
.bar-track{position:absolute;inset:1.5px 0;background:rgba(30,45,84,.07);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .35s ease}
.bar-fill.ok  {background:var(--ok)}
.bar-fill.warn{background:#D97706}
.bar-fill.ko  {background:var(--ko)}
.pace-mk{position:absolute;top:0;bottom:0;width:2px;background:rgba(30,45,84,.25);border-radius:1px;transform:translateX(-50%)}

/* row heat (subtle tint) */
.heat-ok  {background:linear-gradient(90deg,var(--ok-bg) var(--w,0%),transparent var(--w,0%)) !important}
.heat-warn{background:linear-gradient(90deg,rgba(217,119,6,.06) var(--w,0%),transparent var(--w,0%)) !important}
.heat-ko  {background:linear-gradient(90deg,var(--ko-bg) var(--w,0%),transparent var(--w,0%)) !important}

/* loader */
.placeholder{display:flex;align-items:center;justify-content:center;height:200px;border-radius:8px;border:1px dashed var(--border);color:var(--tx3);font-size:13px;font-weight:500}
#loader{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--tx2);font-size:12px;font-weight:600;letter-spacing:.06em}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:sp .65s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

// ── pace ─────────────────────────────────────────
function calcPace(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  const dim=new Date(y,m+1,0).getDate();
  let total=0,elapsed=0;
  for(let i=1;i<=dim;i++){
    const dow=new Date(y,m,i).getDay();
    if(dow!==0&&dow!==6){total++;if(i<=d)elapsed++;}
  }
  return{elapsed,total,pct:total?Math.round(elapsed/total*100):0};
}

// ── helpers ───────────────────────────────────────
function g(r,c){return(r[c]||'').trim()}
function pn(v){return parseFloat((v||'0').replace(/\./g,'').replace(',','.'))||0}

function parseCSV(text){
  const lines=text.trim().split('\n');
  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line=>{
    const cells=[];let inQ=false,cell='';
    for(const ch of line){
      if(ch==='"'){inQ=!inQ;continue}
      if(ch===','&&!inQ){cells.push(cell.trim());cell='';continue}
      cell+=ch;
    }
    cells.push(cell.trim());
    const row={};
    headers.forEach((h,i)=>row[h]=cells[i]||'');
    return row;
  }).filter(r=>r['Nome Assessor']&&r['Nome Assessor'].trim());
}

// ── state ─────────────────────────────────────────
let allData=[], selectedTeam='ALL';

// ── tabs ──────────────────────────────────────────
function showTab(id){
  ['gestor','produto','equipe','qualidade'].forEach((t,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',t===id);
    document.getElementById('panel-'+t).classList.toggle('active',t===id);
  });
}

// ── format ────────────────────────────────────────
function fmtR(v){
  const a=Math.abs(v),s=v<0?'−':'';
  if(a>=1e6)return s+'R$ '+(a/1e6).toFixed(1)+'M';
  if(a>=1e3)return s+'R$ '+(a/1e3).toFixed(0)+'k';
  return s+'R$ '+a.toFixed(0);
}
function fmtN(v){return v%1===0?v.toLocaleString('pt-BR'):v.toFixed(1)}

function pColor(p,pace){
  if(p>=100)return'ok';
  if(p>=(pace-5))return'warn';
  return'ko';
}
function projColor(p){return p>=100?'ok':p>=85?'warn':'ko'}

// ── row heat ──────────────────────────────────────
function rowHeat(p){
  if(!p&&p!==0)return'';
  const w=Math.min(Math.max(p,0),100);
  const cls=p>=100?'ok':p>=60?'warn':'ko';
  return`heat-${cls}`;
}

// ── sum ───────────────────────────────────────────
function sk(rows,k){return rows.reduce((a,r)=>a+(r[k]||0),0)}

// ── cells ─────────────────────────────────────────
// Returns object with all cell HTML: Realizado | Meta | % Meta | Projeção | Progresso
function cells(v,meta,isCur,invertBad,pace){
  const display=isCur?fmtR(v):fmtN(v);
  const p=meta?Math.round(v/meta*100):null;
  const bad=meta?(invertBad?v>meta:v<meta):false;
  const vnCls=meta?(bad?'neg':'pos'):'';
  const pc=p!==null?pColor(p,pace):'';
  const pctTxt=p!==null?p+'%':'';
  let projTxt='',projCls='';
  if(meta&&pace>0){
    const proj=Math.round((v/meta)/(pace/100)*100);
    projCls=projColor(proj);
    projTxt=proj+'%';
  }
  const metaDisplay=meta?(isCur?fmtR(meta):fmtN(meta)):'—';
  const bc=p!==null?pColor(p,pace):'gold';
  const barW=p!==null?Math.min(p,100):0;
  const pacePx=Math.min(pace,100);
  const barHTML=p!==null
    ?`<div class="bar-outer"><div class="bar-track"><div class="bar-fill ${bc}" style="width:${barW}%"></div></div><div class="pace-mk" style="left:${pacePx}%"></div></div>`
    :'';
  const heatCls=p!==null?rowHeat(p):'';
  return{vnCls,display,pc,pctTxt,projCls,projTxt,metaDisplay,barHTML,heatCls,p};
}

// ── assessor rows ─────────────────────────────────
// subFields: [{label, field, cur}] for drill-down within an assessor
function aRows(kpiId,field,isCur,rows,subFields){
  const hasSub=subFields&&subFields.length>0;
  return rows.map((a,idx)=>{
    const v=field==='netEmM'?a.netEmM:(a[field]!==undefined?a[field]:0);
    const display=isCur?fmtR(v):fmtN(v);

    const detailHtml=hasSub?subFields.map(sf=>{
      const sv=a[sf.field]!==undefined?a[sf.field]:0;
      const sd=sf.cur?fmtR(sv):fmtN(sv);
      return`<tr class="ra-detail hidden" data-for-a="${kpiId}" data-aid="${idx}">
        <td><div class="lbl"><span class="a-dot"></span><span class="aname" style="font-size:11px">${sf.label}</span></div></td>
        <td class="vn dim sm">${sd}</td>
        <td class="meta-cell"></td><td class="pct-cell"></td><td class="proj-cell"></td><td class="bar-col"></td>
      </tr>`;
    }).join(''):'';

    const chevron=hasSub?`<span class="chev-p" style="font-size:8px">▶</span>`:`<span class="a-dot"></span>`;
    return`<tr class="ra hidden" data-for="${kpiId}" data-aid="${idx}" data-has-detail="${hasSub?1:0}"${hasSub?` onclick="toggleAssessorDetail('${kpiId}',${idx})"`:''}>
      <td><div class="lbl">${chevron}<span class="aname">${a.nome}</span></div></td>
      <td class="vn dim">${display}</td>
      <td class="meta-cell"></td><td class="pct-cell"></td><td class="proj-cell"></td><td class="bar-col"></td>
    </tr>${detailHtml}`;
  }).join('');
}

// ── hero card ─────────────────────────────────────
function heroCard(eyebrow,val,meta,isCur,pace,isCount){
  const display=isCount?fmtN(val):(isCur?fmtR(val):'—');
  const p=meta?Math.round(val/meta*100):null;
  const cls=p!==null?pColor(p,pace):'';
  const proj=meta&&pace>0?Math.round((val/meta)/(pace/100)*100):null;
  const metaFmt=meta?(isCount?fmtN(meta):fmtR(meta)):null;
  const barW=p!==null?Math.min(p,100):0;
  return`<div class="hero-card">
    <div class="hero-eyebrow">${eyebrow}</div>
    <div class="hero-val ${cls}">${display}</div>
    <div class="hero-meta">${metaFmt?`de <b>${metaFmt}</b>${proj!==null?' · proj. '+proj+'%':''}`:'&nbsp;'}</div>
    ${p!==null?`<div class="hero-bar-row">
      <div class="hero-track"><div class="hero-fill ${cls}" style="width:${barW}%"></div></div>
      <span class="hero-pct">${p}%</span>
    </div>`:''}
  </div>`;
}

// ── build Visão Gestor ────────────────────────────
function buildGestor(){
  const panel=document.getElementById('panel-gestor');
  const teams=[...new Set(allData.map(r=>r.equipe).filter(Boolean))].sort();
  const rows=selectedTeam==='ALL'?allData:allData.filter(r=>r.equipe===selectedTeam);
  const pace=calcPace();
  const n=rows.length||1;

  // header badges
  const pb=document.getElementById('pace-badge');
  const pcls=pace.pct>=100?'ok':pace.pct>=70?'warn':'ko';
  pb.textContent=`Pace ${pace.pct}% · D${pace.elapsed}/${pace.total}`;
  pb.className=`hbadge ${pcls}`;
  const dt=rows[0]?.dtAtual||'';
  if(dt)document.getElementById('date-badge').textContent=dt;

  // aggregates
  const t={};
  ['capLiq','capPF','capPJ','pme','corp',
   'aPF','a3p','a3m','aPJ','a3pPJ','a3mPJ',
   'receita','rRF','rRV','rCet','rCOE','rInt','rFun','rPrev','rFee','rCam',
   'netEmM','r1','r2','apolEm','feCons','conAnd',
   'modServ','saude','rupt','npsNR','npsResp',
   'metaCapLiq','metaCapPF','metaCapPJ','metaReceita',
   'metaModServ','metaSaude','metaRupt','metaPASeg',
   'metaR1','metaR2','metaCons','metaAtiv300m','metaAtivTotal','metaNPS',
  ].forEach(k=>t[k]=sk(rows,k));

  const capMeta  = t.metaCapLiq  ||null;
  const recMeta  = t.metaReceita ||null;
  const ativ300k = t.a3p + t.a3pPJ; // PF 300k+ + PJ 300k+
  const metaModServAvg = t.metaModServ?t.metaModServ/n:null;
  const metaSaudeAvg   = t.metaSaude  ?t.metaSaude  /n:null;

  // Sub-fields para cascata dupla (por assessor → breakdown do assessor)
  const SUB_RECEITA=[
    {label:'Renda Fixa',    field:'rRF', cur:true},
    {label:'Renda Variável',field:'rRV', cur:true},
    {label:'Cetipados',     field:'rCet',cur:true},
    {label:'COE',           field:'rCOE',cur:true},
    {label:'Internacional', field:'rInt',cur:true},
    {label:'Fundos',        field:'rFun',cur:true},
    {label:'Previdência',   field:'rPrev',cur:true},
    {label:'Fee Fixo',      field:'rFee',cur:true},
    {label:'Câmbio',        field:'rCam',cur:true},
  ];
  const SUB_CAPLIQ=[
    {label:'PF',        field:'capPF',cur:true},
    {label:'PJ',        field:'capPJ',cur:true},
    {label:'PME',       field:'pme',  cur:true},
    {label:'Corporate', field:'corp', cur:true},
  ];
  const SUB_SEGUROS=[
    {label:'R1 — Reuniões',field:'r1',cur:false},
    {label:'R2 — Reuniões',field:'r2',cur:false},
  ];

  // KPI tree
  const KPIS=[
    {id:'capLiq', label:'Captação Líquida', val:t.capLiq, meta:capMeta, cur:true, field:'capLiq',
     subFields:SUB_CAPLIQ,
     children:[
      {id:'capPF',label:'Cap. Líq. PF',val:t.capPF,meta:t.metaCapPF||null,cur:true,field:'capPF'},
      {id:'capPJ',label:'Cap. Líq. PJ',val:t.capPJ,meta:t.metaCapPJ||null,cur:true,field:'capPJ',children:[
        {id:'pme', label:'PME',       val:t.pme, cur:true,field:'pme'},
        {id:'corp',label:'Corporate', val:t.corp,cur:true,field:'corp'},
      ]},
    ]},
    {id:'auc',label:'AUC (Net Em M)',val:t.netEmM,meta:null,cur:true,field:'netEmM'},
    {id:'aPF',label:'Ativações PF',val:t.aPF,meta:t.metaAtivTotal||null,cur:false,field:'aPF',children:[
      {id:'a3p', label:'PF 300k+',val:t.a3p, meta:null,cur:false,field:'a3p'},
      {id:'a3m', label:'PF 300k-',val:t.a3m, meta:t.metaAtiv300m||null,cur:false,field:'a3m'},
    ]},
    {id:'aPJ',label:'Ativações PJ',val:t.aPJ,meta:null,cur:false,field:'aPJ',children:[
      {id:'a3pPJ',label:'PJ 300k+',val:t.a3pPJ,cur:false,field:'a3pPJ'},
      {id:'a3mPJ',label:'PJ 300k-',val:t.a3mPJ,cur:false,field:'a3mPJ'},
    ]},
    {id:'receita',label:'Receita Total',val:t.receita,meta:recMeta,cur:true,field:'receita',
     subFields:SUB_RECEITA,
     children:[
      {id:'rRF', label:'Renda Fixa',    val:t.rRF, cur:true,field:'rRF'},
      {id:'rRV', label:'Renda Variável',val:t.rRV, cur:true,field:'rRV'},
      {id:'rCet',label:'Cetipados',     val:t.rCet,cur:true,field:'rCet'},
      {id:'rCOE',label:'COE',           val:t.rCOE,cur:true,field:'rCOE'},
      {id:'rInt',label:'Internacional', val:t.rInt,cur:true,field:'rInt'},
      {id:'rFun',label:'Fundos',        val:t.rFun,cur:true,field:'rFun'},
      {id:'rPrev',label:'Previdência',  val:t.rPrev,cur:true,field:'rPrev'},
      {id:'rFee',label:'Fee Fixo',      val:t.rFee,cur:true,field:'rFee'},
      {id:'rCam',label:'Câmbio',        val:t.rCam,cur:true,field:'rCam'},
    ]},
    {id:'seguros',label:'PA Seguros',val:t.apolEm,meta:t.metaPASeg||null,cur:false,field:'apolEm',
     subFields:SUB_SEGUROS,
     children:[
      {id:'r1',label:'R1 — Reuniões',val:t.r1,meta:t.metaR1||null,cur:false,field:'r1'},
      {id:'r2',label:'R2 — Reuniões',val:t.r2,meta:t.metaR2||null,cur:false,field:'r2'},
    ]},
    {id:'feCons', label:'Consórcio — Fechamentos',val:t.feCons,  meta:t.metaCons||null, cur:false,field:'feCons'},
    {id:'modServ',label:'Modelo de Serviço',       val:t.modServ/n,meta:metaModServAvg,  cur:false,field:'modServ'},
    {id:'saude',  label:'Saúde do Cliente',         val:t.saude/n,  meta:metaSaudeAvg,    cur:false,field:'saude'},
    {id:'rupt',   label:'Ruptura',                  val:t.rupt,     meta:t.metaRupt||null,cur:false,field:'rupt',invertBad:true},
    {id:'nps',    label:'NPS Respondidos',          val:t.npsResp,  meta:t.metaNPS||null, cur:false,field:'npsResp'},
  ];

  // --- render rows ---
  function makeR0(kpi){
    const hasC=!!(kpi.children?.length);
    const hasSub=!!(kpi.subFields?.length);
    const c=cells(kpi.val,kpi.meta||null,kpi.cur,kpi.invertBad||false,pace.pct);
    const rowClick=hasC||hasSub?`toggleAssessors('${kpi.id}')`:`toggleLeaf('${kpi.id}')`;
    const chevClick=hasC?`event.stopPropagation();toggleProducts('${kpi.id}')`:`event.stopPropagation();toggleLeaf('${kpi.id}')`;
    const hintHTML=hasC&&hasSub?`<span class="mode-hint">linha = assessores · ▶ = produtos</span>`:'';
    return`<tr class="r0 ${c.heatCls}" data-id="${kpi.id}" onclick="${rowClick}" style="${c.p!==null?`--w:${Math.min(c.p,100)}%`:''}">
      <td><div class="lbl">
        <span class="chev-p" onclick="${chevClick}">▶</span>
        <span class="kname">${kpi.label}</span>${hintHTML}
      </div></td>
      <td class="vn ${c.vnCls}">${c.display}</td>
      <td class="meta-cell">${c.metaDisplay}</td>
      <td class="pct-cell ${c.pc}">${c.pctTxt}</td>
      <td class="proj-cell ${c.projCls}">${c.projTxt}</td>
      <td class="bar-col">${c.barHTML}</td>
    </tr>`;
  }

  function makeR1(child,parentId){
    const hasC=!!(child.children?.length);
    const c=cells(child.val,child.meta||null,child.cur,false,pace.pct);
    const chevClick=hasC?`event.stopPropagation();toggleProducts('${child.id}')`:`event.stopPropagation();toggleSubKPI('${child.id}')`;
    return`<tr class="r1 hidden ${c.heatCls}" data-id="${child.id}" data-parent="${parentId}" onclick="toggleSubKPI('${child.id}')" style="${c.p!==null?`--w:${Math.min(c.p,100)}%`:''}">
      <td><div class="lbl">
        ${hasC?`<span class="chev-p" onclick="${chevClick}">▶</span>`:`<span style="width:14px;display:inline-block"></span>`}
        <span class="sname">${child.label}</span>
      </div></td>
      <td class="vn ${c.vnCls}">${c.display}</td>
      <td class="meta-cell">${c.metaDisplay}</td>
      <td class="pct-cell ${c.pc}">${c.pctTxt}</td>
      <td class="proj-cell ${c.projCls}">${c.projTxt}</td>
      <td class="bar-col">${c.barHTML}</td>
    </tr>`;
  }

  function makeR2(child2,parentId){
    const c=cells(child2.val,null,child2.cur,false,pace.pct);
    return`<tr class="r2 hidden" data-id="${child2.id}" data-parent="${parentId}" onclick="toggleSubKPI('${child2.id}')">
      <td><div class="lbl"><span class="chev-p">▶</span><span class="ssname">${child2.label}</span></div></td>
      <td class="vn ${c.vnCls}">${c.display}</td>
      <td class="meta-cell">—</td><td class="pct-cell"></td><td class="proj-cell"></td><td class="bar-col"></td>
    </tr>`;
  }

  let tbody='';
  for(const kpi of KPIS){
    tbody+=makeR0(kpi);
    // assessor rows (shown via toggleAssessors or toggleLeaf)
    tbody+=aRows(kpi.id,kpi.field,kpi.cur,rows,kpi.subFields||null);
    // product children rows
    if(kpi.children?.length){
      for(const child of kpi.children){
        tbody+=makeR1(child,kpi.id);
        if(child.children?.length){
          for(const c2 of child.children){
            tbody+=makeR2(c2,child.id);
            tbody+=aRows(c2.id,c2.field,c2.cur,rows,null);
          }
        }else{
          tbody+=aRows(child.id,child.field,child.cur,rows,null);
        }
      }
    }
  }

  panel.innerHTML=`
  <div class="hero-strip">
    ${heroCard('Captação Líquida',t.capLiq,capMeta,true,pace.pct,false)}
    ${heroCard('Receita Total',t.receita,recMeta,true,pace.pct,false)}
    ${heroCard('Ativações 300k+ (PF+PJ)',ativ300k,t.metaAtivTotal||null,false,pace.pct,true)}
  </div>
  <div class="team-bar">
    <span class="team-label">Equipe</span>
    <button class="pill ${selectedTeam==='ALL'?'active':''}" onclick="selectTeam('ALL')">Todas</button>
    ${teams.map(eq=>`<button class="pill ${selectedTeam===eq?'active':''}" onclick="selectTeam('${eq}')">${eq}</button>`).join('')}
  </div>
  <div class="legend">
    <span class="legend-item"><span class="legend-icon">▶</span> Por produto</span>
    <span class="legend-item" style="color:var(--gold)">|</span>
    <span class="legend-item">Linha = assessores (nos KPIs com ▶ e dica)</span>
  </div>
  <div class="table-wrap">
    <table class="kt">
      <thead><tr>
        <th>Indicador</th>
        <th class="r">Realizado</th>
        <th class="r">Meta</th>
        <th class="c" style="width:56px">% Meta</th>
        <th class="c" style="width:68px">Projeção</th>
        <th class="c" style="width:140px">Progresso</th>
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

// ── toggle functions ──────────────────────────────

// helpers
function _openA(id,row){
  document.querySelectorAll(`tr.ra[data-for="${id}"]`).forEach(r=>r.classList.remove('hidden'));
  row.classList.add('open-a');
  row.dataset.mode='a';
}
function _closeA(id,row){
  document.querySelectorAll(`tr.ra[data-for="${id}"]`).forEach(r=>{
    r.classList.add('hidden');
    r.classList.remove('open-a');
    const aid=r.dataset.aid;
    if(aid!=null)document.querySelectorAll(`tr.ra-detail[data-for-a="${id}"][data-aid="${aid}"]`).forEach(d=>d.classList.add('hidden'));
  });
  row.classList.remove('open-a');
  row.dataset.mode='';
}
function _openP(id,row){
  document.querySelectorAll(`tr[data-parent="${id}"]`).forEach(r=>r.classList.remove('hidden'));
  row.classList.add('open-p');
  row.dataset.mode='p';
}
function _closeP(id,row){
  document.querySelectorAll(`tr[data-parent="${id}"]`).forEach(r=>{
    r.classList.add('hidden');r.classList.remove('open-a','open-p');
    const cid=r.dataset.id;
    if(cid){
      document.querySelectorAll(`tr.ra[data-for="${cid}"]`).forEach(a=>a.classList.add('hidden'));
      document.querySelectorAll(`tr[data-parent="${cid}"]`).forEach(s=>s.classList.add('hidden'));
    }
  });
  row.classList.remove('open-p');
  row.dataset.mode='';
}

// Complex KPI: row click = assessor view
function toggleAssessors(id){
  const row=document.querySelector(`tr[data-id="${id}"]`);if(!row)return;
  const mode=row.dataset.mode||'';
  if(mode==='p')_closeP(id,row);
  mode==='a'?_closeA(id,row):_openA(id,row);
}
// Complex KPI: chevron = product view
function toggleProducts(id){
  const row=document.querySelector(`tr[data-id="${id}"]`);if(!row)return;
  const mode=row.dataset.mode||'';
  if(mode==='a')_closeA(id,row);
  mode==='p'?_closeP(id,row):_openP(id,row);
}
// Leaf KPI: single toggle = assessors
function toggleLeaf(id){
  const row=document.querySelector(`tr[data-id="${id}"]`);if(!row)return;
  const mode=row.dataset.mode||'';
  mode==='a'?_closeA(id,row):_openA(id,row);
}
// Sub-KPI (r1/r2): click = assessors for that sub
function toggleSubKPI(id){
  const row=document.querySelector(`tr[data-id="${id}"]`);if(!row)return;
  const mode=row.dataset.mode||'';
  if(mode==='a'){
    document.querySelectorAll(`tr.ra[data-for="${id}"]`).forEach(r=>r.classList.add('hidden'));
    row.classList.remove('open-a');row.dataset.mode='';
  }else{
    document.querySelectorAll(`tr.ra[data-for="${id}"]`).forEach(r=>r.classList.remove('hidden'));
    row.classList.add('open-a');row.dataset.mode='a';
  }
}
// Assessor detail: click assessor → show their sub-breakdown
function toggleAssessorDetail(kpiId,aid){
  const aRow=document.querySelector(`tr.ra[data-for="${kpiId}"][data-aid="${aid}"]`);
  const details=document.querySelectorAll(`tr.ra-detail[data-for-a="${kpiId}"][data-aid="${aid}"]`);
  const isOpen=aRow?.classList.contains('open-a');
  aRow?.classList.toggle('open-a',!isOpen);
  details.forEach(r=>r.classList.toggle('hidden',isOpen));
}

function selectTeam(t){selectedTeam=t;buildGestor()}

// ── load ──────────────────────────────────────────
async function loadData(){
  try{
    const res=await fetch(CSV_URL);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const text=await res.text();
    if(text.includes('<html')||text.length<100)throw new Error('not csv');
    const parsed=parseCSV(text);
    allData=mapRows(parsed);
    if(!allData.length)throw new Error('empty');
  }catch(e){
    console.warn('Demo mode:',e.message);
    allData=mapRows(parseCSV(DEMO_CSV));
  }
  buildGestor();
}

loadData();
