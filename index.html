<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K3 Daily</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

:root {
  --blue:   #1E2D54;
  --gold:   #D1A771;
  --bg:     #EEF1F8;
  --white:  #FFFFFF;
  --s1:     #F8F9FC;
  --s2:     #F1F4FA;
  --s3:     #E8EDF5;
  --hov:    #E5EBFF;
  --border: rgba(30,45,84,.10);
  --tx:     #1E2D54;
  --tx2:    #5B6F9E;
  --tx3:    #94A3C0;
  --ok:     #15803D;
  --ko:     #B91C1C;
  --warn:   #92400E;
  --ok-bg:  rgba(21,128,61,.08);
  --ko-bg:  rgba(185,28,28,.06);
  --f:      'Montserrat','Segoe UI',sans-serif;
  --fd:     'Montserrat','Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:14px;line-height:1.5}

/* ── header ─────────────────────────────────────── */
header{
  background:var(--blue);border-bottom:2px solid var(--gold);
  padding:0 28px;display:flex;align-items:center;gap:14px;height:52px;
  position:sticky;top:0;z-index:100;
}
.logo{font-weight:800;font-size:16px;letter-spacing:.08em;color:var(--gold);display:flex;align-items:center;gap:8px}
.logo-sep{width:1px;height:18px;background:rgba(209,167,113,.3)}
.logo-sub{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbadge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:3px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6)}
.hbadge.ok  {border-color:rgba(21,128,61,.5);color:#86efac}
.hbadge.warn{border-color:rgba(146,64,14,.5);color:#fcd34d}
.hbadge.ko  {border-color:rgba(185,28,28,.5);color:#fca5a5}
.hbadge.date{color:var(--gold);border-color:rgba(209,167,113,.3)}

/* ── tabs ───────────────────────────────────────── */
nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;display:flex}
.tab{padding:11px 20px;font-size:10px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;
  color:var(--tx3);cursor:pointer;border:none;background:none;font-family:var(--f);
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab:hover{color:var(--tx2)}
.tab.active{color:var(--blue);border-bottom-color:var(--gold)}
.panel{display:none;padding:24px 28px 60px}
.panel.active{display:block}


/* ── team selector ──────────────────────────────── */
.team-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.team-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-right:6px}
.pill{
  padding:4px 14px;border-radius:4px;border:1.5px solid var(--border);
  font-size:11px;font-weight:600;letter-spacing:.03em;cursor:pointer;font-family:var(--f);
  background:transparent;color:var(--tx2);transition:all .12s;
}
.pill:hover{border-color:var(--blue);color:var(--blue)}
.pill.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* ── legend ─────────────────────────────────────── */
.legend{display:flex;gap:16px;margin-bottom:10px;font-size:10px;color:var(--tx3);font-weight:600;letter-spacing:.04em}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-icon{font-size:9px;color:var(--tx3)}

/* ── table ──────────────────────────────────────── */
.table-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;overflow-x:auto;background:var(--white)}
.kt{width:100%;border-collapse:collapse;min-width:580px;table-layout:fixed}

.kt thead th{
  background:var(--blue);padding:9px 10px;color:rgba(255,255,255,.7);
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap;
}
.kt thead th.r{text-align:right}
.kt thead th.c{text-align:center}

/* row families */
.kt tr.r0 td{padding:10px 10px;background:var(--white);border-bottom:1px solid var(--border);vertical-align:middle}
.kt tr.r0{cursor:pointer}
.kt tr.r0:hover td{background:var(--hov)}

/* assessor mode: gold left border on parent */
.kt tr.r0.open-a>td:first-child{border-left:3px solid var(--gold)}
/* product mode: chevron rotates */
.kt tr.r0.open-p .chev-p,.kt tr.r1.open-p .chev-p{transform:rotate(90deg)}
.kt tr.r0.open-a .chev-p,.kt tr.r1.open-a .chev-p{color:var(--gold)}

.kt tr.r1{cursor:pointer}
.kt tr.r1 td{padding:8px 10px 8px 28px;background:var(--s1);border-bottom:1px solid var(--border);vertical-align:middle}
.kt tr.r1:hover td{background:var(--hov)}
.kt tr.r1.open-a>td:first-child{border-left:2px solid rgba(209,167,113,.5)}

.kt tr.r2{cursor:pointer}
.kt tr.r2 td{padding:7px 10px 7px 46px;background:var(--s2);border-bottom:1px solid rgba(30,45,84,.05);vertical-align:middle}
.kt tr.r2:hover td{background:var(--hov)}
.kt tr.r2.open-a>td:first-child{border-left:2px solid rgba(209,167,113,.3)}

/* assessor row */
.kt tr.ra td{padding:6px 10px 6px 36px;background:var(--s2);border-bottom:1px solid rgba(30,45,84,.05);vertical-align:middle;cursor:default}
.kt tr.ra[data-has-detail="1"]{cursor:pointer}
.kt tr.ra[data-has-detail="1"]:hover td{background:var(--s3)}
.kt tr.ra.open-a>td:first-child{border-left:2px solid rgba(209,167,113,.25)}

/* assessor detail (sub-product per assessor) */
.kt tr.ra-detail td{padding:5px 10px 5px 56px;background:var(--s3);border-bottom:1px solid rgba(30,45,84,.04);vertical-align:middle}

.kt tr.hidden{display:none}

/* labels */
.lbl{display:flex;align-items:center;gap:7px}
.chev-p{width:14px;height:14px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--tx3);transition:transform .18s;cursor:pointer}
.kname {font-weight:600;font-size:13px;color:var(--tx)}
.sname {font-weight:500;font-size:12px;color:var(--tx2)}
.ssname{font-weight:500;font-size:11px;color:var(--tx3)}
.aname {font-size:12px;font-weight:500;color:var(--tx2)}
.a-dot {width:5px;height:5px;border-radius:50%;background:var(--tx3);flex-shrink:0}
.mode-hint{font-size:9px;color:var(--tx3);font-weight:500;margin-left:4px;
  background:rgba(30,45,84,.06);padding:1px 6px;border-radius:10px;white-space:nowrap}

/* value cells */
.vn{text-align:right;font-size:13px;font-weight:600;white-space:nowrap;color:var(--tx)}
.vn.dim{color:var(--tx2);font-weight:500}
.vn.sm{font-size:11px}

.dt-cell{text-align:center;font-size:11px;color:var(--tx3);white-space:nowrap}
.meta-cell{text-align:right;font-size:12px;color:var(--tx);white-space:nowrap}
.pct-cell{text-align:right;font-size:12px;white-space:nowrap;width:52px;color:var(--tx2)}
.pct-cell.ok  {color:var(--ok);font-weight:700}
.pct-cell.warn{color:#92400E;font-weight:700}
.pct-cell.ko  {color:var(--ko);font-weight:700}
.proj-cell{text-align:right;font-size:12px;font-weight:700;white-space:nowrap;width:80px;color:var(--tx3)}
.proj-cell.ok  {color:var(--ok)}
.proj-cell.warn{color:#92400E}
.proj-cell.ko  {color:var(--ko)}


/* row heat (subtle tint) */
.heat-ok  {background:linear-gradient(90deg,var(--ok-bg) var(--w,0%),transparent var(--w,0%)) !important}
.heat-warn{background:linear-gradient(90deg,rgba(217,119,6,.06) var(--w,0%),transparent var(--w,0%)) !important}
.heat-ko  {background:linear-gradient(90deg,var(--ko-bg) var(--w,0%),transparent var(--w,0%)) !important}

/* loader */
.placeholder{display:flex;align-items:center;justify-content:center;height:200px;border-radius:8px;border:1px dashed var(--border);color:var(--tx3);font-size:13px;font-weight:500}
#loader{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--tx2);font-size:12px;font-weight:600;letter-spacing:.06em}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:sp .65s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── login overlay ───────────────────────────────── */
.login-overlay{position:fixed;inset:0;background:var(--blue);z-index:999;display:flex;align-items:center;justify-content:center}
.login-overlay.hidden{display:none}
.login-box{background:var(--white);border-radius:12px;padding:44px 36px 36px;width:300px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.login-logo{font-weight:800;font-size:24px;letter-spacing:.08em;color:var(--blue)}
.login-logo-sub{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:28px;margin-top:2px}
.login-pin{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--f);font-size:16px;letter-spacing:.25em;text-align:center;outline:none;margin-bottom:10px;color:var(--tx);background:var(--s1)}
.login-pin:focus{border-color:var(--blue);background:var(--white)}
.login-btn{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-family:var(--f);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.login-btn:hover{opacity:.85}
.login-err{margin-top:10px;font-size:11px;color:var(--ko);font-weight:600;min-height:16px;letter-spacing:.02em}
.login-err.hidden{visibility:hidden}
.logout-btn{font-size:11px;font-weight:600;padding:3px 10px;border-radius:3px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.55);background:none;cursor:pointer;font-family:var(--f);transition:all .12s}
.logout-btn:hover{border-color:rgba(255,255,255,.45);color:rgba(255,255,255,.9)}

/* ── mes / comparação ────────────────────────────── */
.mes-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
.compare-on{background:rgba(209,167,113,.18)!important;border-color:var(--gold)!important;color:var(--gold)!important}
.delta{font-size:10px;font-weight:700;margin-left:5px;padding:1px 5px;border-radius:3px;white-space:nowrap;vertical-align:middle}
.delta.ok{color:var(--ok);background:var(--ok-bg)}
.delta.ko{color:var(--ko);background:var(--ko-bg)}
.delta.eq{color:var(--tx3);background:rgba(30,45,84,.06)}

/* ── painel por assessor ─────────────────────────── */
.assessor-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.asel{padding:6px 12px;border:1.5px solid var(--border);border-radius:4px;font-family:var(--f);font-size:12px;font-weight:600;color:var(--tx);background:var(--white);cursor:pointer;min-width:200px;max-width:360px}
.asel:focus{outline:none;border-color:var(--blue)}
.a-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:3px;border:1px solid var(--border);color:var(--tx2);background:var(--s1)}

/* ── gráficos por equipe ─────────────────────────── */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
@media(max-width:780px){.chart-grid{grid-template-columns:1fr}}
.chart-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:16px 18px}
.chart-card-wide{grid-column:1/-1}
.chart-title{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:8px;letter-spacing:.02em;text-transform:uppercase}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chart-leg-item{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--tx2)}
.chart-leg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.chart-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chart-team-lbl{font-size:11px;font-weight:600;color:var(--tx2);white-space:nowrap;width:100px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis}
.chart-bar-area{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.chart-track{flex:1;height:26px;background:rgba(30,45,84,.07);border-radius:4px;overflow:hidden;display:flex;min-width:0}
.chart-seg{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.chart-seg-lbl{font-size:10px;font-weight:700;color:#fff;padding:0 5px;white-space:nowrap;pointer-events:none}
.chart-total{font-size:11px;font-weight:700;color:var(--tx);white-space:nowrap;min-width:62px;text-align:right;flex-shrink:0}
#k3tip{position:fixed;pointer-events:none;z-index:9999;background:rgba(30,45,84,.92);color:#fff;font-size:12px;font-weight:600;font-family:var(--f);padding:5px 10px;border-radius:5px;white-space:nowrap;display:none;transform:translate(12px,-50%)}
</style>
</head>
<body>

<div id="login-overlay" class="login-overlay">
  <div class="login-box">
    <div class="login-logo">K3</div>
    <div class="login-logo-sub">Daily · Acesso Restrito</div>
    <input id="pin-input" class="login-pin" type="password" placeholder="••••••" autocomplete="off" onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="login-btn" onclick="tryLogin()">Entrar</button>
    <div id="login-err" class="login-err hidden">PIN inválido</div>
  </div>
</div>

<header>
  <div class="logo">K3<div class="logo-sep"></div><span class="logo-sub">Daily</span></div>
  <div class="header-right">
    <span id="pace-badge" class="hbadge">—</span>
    <span id="date-badge" class="hbadge date">—</span>
    <button class="logout-btn" id="logout-btn" onclick="logout()" style="display:none">Sair</button>
  </div>
</header>

<nav>
  <button class="tab active" onclick="showTab('gestor')">Visão Gestor</button>
  <button class="tab" onclick="showTab('assessor')">Por Assessor</button>
  <button class="tab" onclick="showTab('produto')">Por Produto</button>
  <button class="tab" onclick="showTab('equipe')">Por Equipe</button>
  <button class="tab" onclick="showTab('qualidade')">Qualidade</button>
</nav>

<div id="panel-gestor"   class="panel active"><div id="loader"><div class="spin"></div>&nbsp;Carregando</div></div>
<div id="panel-assessor" class="panel"><div class="placeholder">Carregando assessores…</div></div>
<div id="panel-produto"  class="panel"><div class="placeholder">Em breve — Por Produto</div></div>
<div id="panel-equipe"   class="panel"><div class="placeholder">Em breve — Por Equipe</div></div>
<div id="panel-qualidade"class="panel"><div class="placeholder">Em breve — Qualidade</div></div>

<script>
// ── fontes de dados (abas do Sheets) ─────────────────
const _BASE='https://docs.google.com/spreadsheets/d/e/2PACX-1vS_nh83QnSTkoyrf8utSgJaYLet2rbixbZw7wMMnFtyefFNOAquXH5UkW-Hu2cN7EzQgOGYCGnGSKI8/pub?output=csv';
const CSV_CONSOLIDADO = _BASE+'&gid=0';            // resultados dos assessores
const CSV_METAS       = _BASE+'&gid=1776920911';   // metas por assessor
const CSV_DATAS       = _BASE+'&gid=287555750';    // data de atualização por coluna
const CSV_PRODUTO_META= _BASE+'&gid=1366112441';   // meta total por produto de receita

// ── pace ─────────────────────────────────────────
function calcPace(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), d=now.getDate();
  const dim=new Date(y,m+1,0).getDate();
  let total=0,elapsed=0;
  for(let i=1;i<=dim;i++){
    const dow=new Date(y,m,i).getDay();
    if(dow!==0&&dow!==6){total++;if(i<=d)elapsed++;}
  }
  return{elapsed,total,pct:total?Math.round(elapsed/total*100):0};
}

// ── helpers ───────────────────────────────────────
function g(r,c){return(r[c]||'').trim()}
function pn(v){return parseFloat((v||'0').replace(/\./g,'').replace(',','.'))||0}

function mesOrder(s){
  const M={Jan:1,Fev:2,Mar:3,Abr:4,Mai:5,Jun:6,Jul:7,Ago:8,Set:9,Out:10,Nov:11,Dez:12};
  const p=(s||'').split('/');
  return(p[1]?2000+parseInt(p[1]):0)*100+(M[p[0]]||0);
}
function deltaHtml(cur,ref){
  if(ref===null||ref===undefined||ref===0||!isFinite(cur)||!isFinite(ref))return'';
  const pct=Math.round((cur-ref)/Math.abs(ref)*100);
  if(!isFinite(pct))return'';
  if(pct===0)return`<span class="delta eq">—</span>`;
  const cls=pct>0?'ok':'ko';
  const sym=pct>0?'▲':'▼';
  return`<span class="delta ${cls}">${sym}${Math.abs(pct)}%</span>`;
}

function parseCSV(text){
  const lines=text.trim().split('\n');
  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line=>{
    const cells=[];let inQ=false,cell='';
    for(const ch of line){
      if(ch==='"'){inQ=!inQ;continue}
      if(ch===','&&!inQ){cells.push(cell.trim());cell='';continue}
      cell+=ch;
    }
    cells.push(cell.trim());
    const row={};
    headers.forEach((h,i)=>row[h]=cells[i]||'');
    return row;
  });
}

// ── mapeamento de linhas do Consolidado ──────────────
function mapRow(r){
  const m={
    mes:     g(r,'Mês'),
    equipe:  g(r,'Equipe'),
    nome:    g(r,'Nome Assessor'),
    cod:     g(r,'Cod A'),
    dtAtual: g(r,'Data Atualização'),
    capLiq:  pn(g(r,'Cap. Liq. Total')),
    capPF:   pn(g(r,'Captação PF')),
    capPJ:   pn(g(r,'Captação PJ')),
    pme:     pn(g(r,'Cap. Onshore PME Middle')),
    corp:    pn(g(r,'Cap. Onshore Corporate')),
    aPF:     pn(g(r,'Ativação PF')),
    a3p:     pn(g(r,'Ativação PF 300k+')),
    a3m:     pn(g(r,'Ativação PF 300k-')),
    aPJ:     pn(g(r,'Ativação PJ')),
    a3pPJ:   pn(g(r,'Ativação PJ 300k+')),
    a3mPJ:   pn(g(r,'Ativação PJ 300k-')),
    rRF:     pn(g(r,'Receita Renda Fixa')),
    rRV:     pn(g(r,'Receita Renda Variável')),
    rCet:    pn(g(r,'Receita Cetipados')),
    rCOE:    pn(g(r,'Receita COE')),
    rInt:    pn(g(r,'Receita Internacional')),
    rFun:    pn(g(r,'Receita Fundos')),
    rPrev:   pn(g(r,'Receita Previdência')),
    rFee:    pn(g(r,'Receita Fee Fixo')),
    rCam:    pn(g(r,'Receita Câmbio')),
    netEmM:  pn(g(r,'Net Em M')),
    r1:      pn(g(r,'R1 Seguros')),
    r2:      pn(g(r,'R2 Seguros')),
    apolEm:  pn(g(r,'Apolice Emitida')),
    feCons:  pn(g(r,'Fechamento Consórcio')),
    conAnd:  pn(g(r,'Consórcio em Andamento')),
    modServ: pn(g(r,'Modelo de Servir')),
    saude:   pn(g(r,'Saúde do Cliente')),
    rupt:    pn(g(r,'Clientes em Ruptura')),
    npsNR:   pn(g(r,'NPS Sem Resposta')),
    npsResp: pn(g(r,'NPS Respondidos')),
  };
  m.recCalc=m.rRF+m.rRV+m.rCet+m.rCOE+m.rInt+m.rFun+m.rPrev+m.rFee+m.rCam;
  return m;
}

// ── mapeamento de metas por assessor ─────────────────
function mapMeta(r){
  return {
    metaCapLiq:     pn(g(r,'Meta Cap Liquida Total')),
    metaCapPF:      pn(g(r,'Meta Cap Liquida PF')),
    metaCapPJ:      pn(g(r,'Meta Cap Liquida PJ')),
    metaModServ:    pn(g(r,'Meta Modelo de Servir')),
    metaSaude:      pn(g(r,'Meta Saúde do Cliente')),
    metaRupt:       pn(g(r,'Meta Ruptura')),
    metaPASeg:      pn(g(r,'Meta PA Seguros')),
    metaR1:         pn(g(r,'Meta R1 Seguros')),
    metaR2:         pn(g(r,'Meta R2 Seguros')),
    metaCons:       pn(g(r,'Meta Consórcio')),
    metaAtivPF300k: pn(g(r,'Meta Ativação PF 300K +')),
    metaAtivPJ300k: pn(g(r,'Meta Ativação PJ 300K +')),
    metaNPS:        pn(g(r,'Meta Nota NPS')),
  };
}

// ── tabela de datas de atualização por coluna ────────
function parseDateMap(text){
  const map={};
  parseCSV(text).forEach(r=>{if(r['Coluna'])map[r['Coluna']]=r['Data Atualização']||'';});
  return map;
}

// ── meta total por produto de receita ────────────────
function parseProdutoMeta(text){
  const map={};
  parseCSV(text).forEach(r=>{if(r['Produto'])map[r['Produto']]=pn(r['Meta']||'');});
  return map;
}

// ── state ─────────────────────────────────────────

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function tryLogin(){
  const pin=document.getElementById('pin-input').value.trim();
  if(!pin)return;
  const hash=await sha256(pin);
  const role=ACCESS_MAP[hash];
  const err=document.getElementById('login-err');

}

// ── format ────────────────────────────────────────
function fmtR(v){
  const a=Math.abs(v),s=v<0?'−':'';
  if(a>=1e9)return s+'R$ '+(a/1e9).toFixed(1)+'Bi';
  if(a>=1e6)return s+'R$ '+(a/1e6).toFixed(1)+'Mi';
  if(a>=1e3)return s+'R$ '+(a/1e3).toFixed(0)+'k';
  return s+'R$ '+a.toFixed(0);
}
function fmtN(v){return v%1===0?v.toLocaleString('pt-BR'):v.toFixed(1)}

function pColor(p,pace){
  if(p>=100)return'ok';
  if(p>=(pace-5))return'warn';
  return'ko';
}
function projColor(p){return p>=100?'ok':p>=85?'warn':'ko'}

// ── row heat ──────────────────────────────────────
function rowHeat(p){
  if(!p&&p!==0)return'';
  const w=Math.min(Math.max(p,0),100);
  const cls=p>=100?'ok':p>=60?'warn':'ko';
  return`heat-${cls}`;
}

// ── sum ───────────────────────────────────────────
function sk(rows,k){return rows.reduce((a,r)=>a+(r[k]||0),0)}

// ── cells ─────────────────────────────────────────
// showProj: only Receita, Ativações, PA Seguros, Consórcio
function cells(v,meta,isCur,invertBad,pace,showProj){
  const display=isCur?fmtR(v):fmtN(v);
  const p=meta?Math.round(v/meta*100):null;
  const pc=p!==null?pColor(p,pace):'';
  const pctTxt=p!==null?p+'%':'';
  let projTxt='',projCls='';
  if(showProj&&meta&&pace>0){
    const proj=Math.round((v/meta)/(pace/100)*100);
    projCls=projColor(proj);
    projTxt=proj+'%';
  }
  const metaDisplay=meta?(isCur?fmtR(meta):fmtN(meta)):'—';
  const pw=p!==null?Math.max(0,Math.min(p,100)):0;
  const heatCls=p!==null?rowHeat(p):'';
  return{vnCls:'',display,pc,pctTxt,projCls,projTxt,metaDisplay,heatCls,p,pw};
}

// ── assessor rows ─────────────────────────────────
// subFields: [{label, field, cur}] for drill-down within an assessor
function aRows(kpiId,field,isCur,rows,subFields,metaField,invertBad,pace,rbc,showProj){
  const hasSub=subFields&&subFields.length>0;
  const sorted=[...rows].sort((a,b)=>(b[field]||0)-(a[field]||0));
  return sorted.map((a,idx)=>{
    const v=a[field]!==undefined?a[field]:0;
    const aMeta=metaField?(a[metaField]||null):null;
    const c=cells(v,aMeta,isCur,invertBad||false,pace,showProj);
    const refV=rbc?(rbc[a.cod]?.[field]??null):null;
    const dHtml=rbc&&refV!==null?deltaHtml(v,refV):'';

    const detailHtml=hasSub?subFields.map(sf=>{
      const sv=a[sf.field]!==undefined?a[sf.field]:0;
      const sd=sf.cur?fmtR(sv):fmtN(sv);
      return`<tr class="ra-detail hidden" data-for-a="${kpiId}" data-aid="${idx}">
        <td><div class="lbl"><span class="a-dot"></span><span class="aname" style="font-size:11px">${sf.label}</span></div></td>
        <td class="dt-cell"></td>
        <td class="vn dim sm">${sd}</td>
        <td class="meta-cell"></td><td class="pct-cell"></td><td class="proj-cell"></td>
      </tr>`;
    }).join(''):'';

    const chevron=hasSub?`<span class="chev-p" style="font-size:8px">▶</span>`:`<span class="a-dot"></span>`;
    return`<tr class="ra hidden" data-for="${kpiId}" data-aid="${idx}" data-has-detail="${hasSub?1:0}"${hasSub?` onclick="toggleAssessorDetail('${kpiId}',${idx})"`:''}>
      <td><div class="lbl">${chevron}<span class="aname">${a.nome}</span></div></td>
      <td class="dt-cell"></td>
      <td class="vn dim">${c.display}${dHtml}</td>
      <td class="meta-cell">${c.metaDisplay}</td>
      <td class="pct-cell ${c.pc}">${c.pctTxt}</td>
      <td class="proj-cell ${c.projCls}">${c.projTxt}</td>
    </tr>${detailHtml}`;
  }).join('');
}

// helpers
function _openA(id,row){
  document.querySelectorAll(`tr.ra[data-for="${id}"]`).forEach(r=>r.classList.remove('hidden'));
  row.classList.add('open-a');
  row.dataset.mode='a';
}
function _closeA(id,row){
  document.querySelectorAll(`tr.ra[data-for="${id}"]`).forEach(r=>{
    r.classList.add('hidden');
    r.classList.remove('open-a');
    const aid=r.dataset.aid;
    if(aid!=null)document.querySelectorAll(`tr.ra-detail[data-for-a="${id}"][data-aid="${aid}"]`).forEach(d=>d.classList.add('hidden'));
  });
  row.classList.remove('open-a');
  row.dataset.mode='';
}
function _openP(id,row){
  document.querySelectorAll(`tr[data-parent="${id}"]`).forEach(r=>r.classList.remove('hidden'));
  row.classList.add('open-p');
  row.dataset.mode='p';
}
function _closeP(id,row){
  document.querySelectorAll(`tr[data-parent="${id}"]`).forEach(r=>{
    r.classList.add('hidden');r.classList.remove('open-a','open-p');
    const cid=r.dataset.id;
    if(cid){
      document.querySelectorAll(`tr.ra[data-for="${cid}"]`).forEach(a=>a.classList.add('hidden'));
      document.querySelectorAll(`tr[data-parent="${cid}"]`).forEach(s=>s.classList.add('hidden'));
    }
  });
  row.classList.remove('open-p');
  row.dataset.mode='';
}

// Complex KPI: row click = assessor view
function toggleAssessors(id){
  const row=document.querySelector(`tr[data-id="${id}"]`);if(!row)return;
  const mode=row.dataset.mode||'';
  if(mode==='p')_closeP(id,row);
  mode==='a'?_closeA(id,row):_openA(id,row);
}
// Complex KPI: chevron = product view
function toggleProducts(id){
  const row=document.querySelector(`tr[data-id="${id}"]`);if(!row)return;
  const mode=row.dataset.mode||'';
  if(mode==='a')_closeA(id,row);
  mode==='p'?_closeP(id,row):_openP(id,row);
}
// Leaf KPI: single toggle = assessors
function toggleLeaf(id){
  const row=document.querySelector(`tr[data-id="${id}"]`);if(!row)return;
  const mode=row.dataset.mode||'';
  mode==='a'?_closeA(id,row):_openA(id,row);
}
// Sub-KPI (r1/r2): click = assessors for that sub
function toggleSubKPI(id){
  const row=document.querySelector(`tr[data-id="${id}"]`);if(!row)return;
  const mode=row.dataset.mode||'';
  if(mode==='a'){
    document.querySelectorAll(`tr.ra[data-for="${id}"]`).forEach(r=>r.classList.add('hidden'));
    row.classList.remove('open-a');row.dataset.mode='';
  }else{
    document.querySelectorAll(`tr.ra[data-for="${id}"]`).forEach(r=>r.classList.remove('hidden'));
    row.classList.add('open-a');row.dataset.mode='a';
  }
}
// Assessor detail: click assessor → show their sub-breakdown
function toggleAssessorDetail(kpiId,aid){
  const aRow=document.querySelector(`tr.ra[data-for="${kpiId}"][data-aid="${aid}"]`);
  const details=document.querySelectorAll(`tr.ra-detail[data-for-a="${kpiId}"][data-aid="${aid}"]`);
  const isOpen=aRow?.classList.contains('open-a');
  aRow?.classList.toggle('open-a',!isOpen);
  details.forEach(r=>r.classList.toggle('hidden',isOpen));
}

function selectTeam(t){selectedTeam=t;buildGestor();if(isAssessorTab())buildAssessor();if(isEquipeTab())buildEquipe()}
function selectMes(m){selectedMes=m;if(compareMes===m)compareMes=null;buildGestor();if(isAssessorTab())buildAssessor();if(isEquipeTab())buildEquipe()}
function setCompare(m){compareMes=m;buildGestor()}
function toggleCompare(){
  if(compareMes){compareMes=null;}
  else{const i=mesList.indexOf(selectedMes);compareMes=mesList[i>0?i-1:mesList.findIndex(m=>m!==selectedMes)]||null;}
  buildGestor();
}

// ── load ──────────────────────────────────────────
async function safeFetch(url){
  try{
    const r=await fetch(url);
    const t=await r.text();
    if(t.includes('<html')||t.length<50)return null;
    return t;
  }catch(e){
    console.warn('Fetch falhou:',url,e.message);
    return null;
  }
}

async function loadData(){
  // Consolidado é obrigatório; demais abas são opcionais
  const [tC,tM,tD,tP]=await Promise.all([
    safeFetch(CSV_CONSOLIDADO),
    safeFetch(CSV_METAS),
    safeFetch(CSV_DATAS),
    safeFetch(CSV_PRODUTO_META),
  ]);

  if(!tC){
    const p=document.getElementById('panel-gestor');
    if(p)p.innerHTML='<div class="placeholder">Erro ao carregar dados. Verifique a conexão e tente recarregar.</div>';
    return;
  }

  // Datas e Produto Meta (opcionais)
  dateMap    = tD ? parseDateMap(tD)     : {};
  produtoMeta= tP ? parseProdutoMeta(tP) : {};

  const rowsC=parseCSV(tC).filter(r=>r['Nome Assessor']&&r['Nome Assessor'].trim());
  const rowsM=tM ? parseCSV(tM).filter(r=>r['Cod A']&&r['Cod A'].trim()) : [];

  // join por Cod A
  const metaByCod={};
  rowsM.forEach(r=>{metaByCod[r['Cod A']]=r;});

  // 1. assessores do Consolidado (com meta do join)
  const codsCons=new Set(rowsC.map(r=>r['Cod A']));
  allData=rowsC.map(r=>Object.assign(mapRow(r),mapMeta(metaByCod[r['Cod A']]||{})));

  // 2. assessores só na aba Metas (novos, sem dados ainda no Consolidado)
  rowsM.filter(r=>!codsCons.has(r['Cod A'])).forEach(r=>{
    const base=Object.assign(mapRow({}),{equipe:g(r,'Equipe'),nome:g(r,'Nome Assessor'),cod:g(r,'Cod A')});
    allData.push(Object.assign(base,mapMeta(r)));
  });

  // extrair meses disponíveis e definir mês selecionado padrão
  const mesSet=new Set(allData.map(r=>r.mes).filter(Boolean));
  mesList=[...mesSet].sort((a,b)=>mesOrder(a)-mesOrder(b));
  if(selectedMes==='LATEST'&&mesList.length)selectedMes=mesList[mesList.length-1];

  if(currentRole){buildGestor();if(isAssessorTab())buildAssessor();if(isEquipeTab())buildEquipe();}
}

// ── painel por equipe (gráficos) ─────────────────
function buildEquipe(){
  const panel=document.getElementById('panel-equipe');
  const hasMes=mesList.length>0;
  const fd=allData.filter(r=>(!hasMes||r.mes===selectedMes)&&r.equipe&&r.nome);
  const teams=[...new Set(fd.map(r=>r.equipe))].sort();
  if(!teams.length){panel.innerHTML='<div class="placeholder">Sem dados disponíveis</div>';return;}

  const FIELDS=['capLiq','capPF','capPJ','pme','corp',
    'aPF','a3p','a3m','aPJ','a3pPJ','a3mPJ',
    'recCalc','rRF','rRV','rCet','rCOE','rInt','rFun','rPrev','rFee','rCam',
    'netEmM','r1','r2','apolEm','feCons','conAnd','modServ','saude','rupt','npsNR','npsResp'];
  const byTeam={};
  teams.forEach(team=>{
    const rows=fd.filter(r=>r.equipe===team);
    byTeam[team]={_n:rows.length};
    FIELDS.forEach(f=>byTeam[team][f]=rows.reduce((s,r)=>s+(r[f]||0),0));
  });

  const CHARTS=[
    {label:'Captação Líquida',cur:true,signed:true,segments:[
      {field:'capPF',label:'PF',color:'#1E2D54'},
      {field:'capPJ',label:'PJ',color:'#D1A771'},
    ]},
    {label:'AUC',cur:true,segments:[
      {field:'netEmM',label:'AUC',color:'#3B82F6'},
    ]},
    {label:'Ativações — Contas 300k+',cur:false,segments:[
      {field:'a3p',  label:'PF 300k+',color:'#15803D'},
      {field:'a3pPJ',label:'PJ 300k+',color:'#1E4D9E'},
    ]},
    {label:'Ativações — Demais',cur:false,segments:[
      {field:'a3m',  label:'PF 300k-',color:'#86EFAC',dark:false},
      {field:'a3mPJ',label:'PJ 300k-',color:'#93C5FD',dark:false},
    ]},
    {label:'Receita Total',cur:true,wide:true,segments:[
      {field:'rRF',  label:'Renda Fixa',    color:'#1E2D54'},
      {field:'rRV',  label:'Renda Variável',color:'#2563EB'},
      {field:'rCet', label:'Cetipados',     color:'#D1A771',dark:false},
      {field:'rCOE', label:'COE',           color:'#7C3AED'},
      {field:'rInt', label:'Internacional', color:'#065F46'},
      {field:'rFun', label:'Fundos',        color:'#DC2626'},
      {field:'rPrev',label:'Previdência',   color:'#EA580C'},
      {field:'rFee', label:'Fee Fixo',      color:'#0891B2'},
      {field:'rCam', label:'Câmbio',        color:'#9D174D'},
    ]},
    {label:'PA Seguros — Apólices Emitidas',cur:true,segments:[
      {field:'apolEm',label:'Apólices Emitidas',color:'#1E4D9E'},
    ]},
    {label:'Consórcio em Andamento',cur:true,segments:[
      {field:'conAnd',label:'Em Andamento',color:'#7C3AED'},
    ]},
    {label:'Reuniões de Seguros',cur:false,segments:[
      {field:'r1',label:'R1',color:'#1E4D9E'},
      {field:'r2',label:'R2',color:'#D1A771',dark:false},
    ]},
    {label:'Consórcio — Fechamentos',cur:true,segments:[
      {field:'feCons',label:'Fechamentos',color:'#065F46'},
    ]},
    {label:'Modelo de Servir',cur:false,avg:true,segments:[
      {field:'modServ',label:'Score',color:'#0891B2'},
    ]},
    {label:'Saúde do Cliente',cur:false,avg:true,segments:[
      {field:'saude',label:'Score',color:'#15803D'},
    ]},
    {label:'Clientes em Ruptura',cur:false,segments:[
      {field:'rupt',label:'Ruptura',color:'#B91C1C'},
    ]},
    {label:'NPS Respondidos',cur:false,segments:[
      {field:'npsResp',label:'Respondidos',color:'#16A34A'},
    ]},
  ];

  function segVal(team,seg,chart){
    const raw=byTeam[team][seg.field]||0;
    return chart.avg?(byTeam[team]._n?raw/byTeam[team]._n:0):raw;
  }
  function fmtSeg(v,cur){return cur?fmtR(v):fmtN(v)}

  function renderChart(chart){
    // totais por equipe e ordenação decrescente
    const teamTotals=teams.map(t=>chart.segments.reduce((s,seg)=>s+segVal(t,seg,chart),0));
    const idx=teamTotals.map((_,i)=>i).sort((a,b)=>teamTotals[b]-teamTotals[a]);
    const sTeams=idx.map(i=>teams[i]);
    const sTotals=idx.map(i=>teamTotals[i]);

    const legendHtml=chart.segments.length>1
      ?`<div class="chart-legend">${chart.segments.map(s=>`<span class="chart-leg-item"><span class="chart-leg-dot" style="background:${s.color}"></span>${s.label}</span>`).join('')}</div>`:'';

    let rowsHtml;
    if(chart.signed){
      // Barras assinadas: positivo = cor normal; negativo = vermelho
      const absMax=Math.max(...sTotals.map(v=>Math.abs(v)),0.001);
      rowsHtml=sTeams.map((team,i)=>{
        const total=sTotals[i];
        const pct=Math.abs(total)/absMax*100;
        const isNeg=total<0;
        const barColor=isNeg?'var(--ko)':chart.segments[0].color;
        // tooltip com breakdown PF/PJ
        const tipParts=chart.segments.map(seg=>{const v=segVal(team,seg,chart);return`${seg.label}: ${fmtSeg(v,chart.cur)}`;}).join(' | ');
        const showLbl=pct>9;
        const bar=pct>0
          ?`<div class="chart-seg" style="width:${pct.toFixed(2)}%;background:${barColor}" data-tip="${tipParts}">${showLbl?`<span class="chart-seg-lbl">${fmtSeg(Math.abs(total),chart.cur)}</span>`:''}</div>`
          :'';
        return`<div class="chart-row">
          <div class="chart-team-lbl" title="${team}">${team}</div>
          <div class="chart-bar-area">
            <div class="chart-track">${bar}</div>
            <span class="chart-total" style="${isNeg?'color:var(--ko)':''}">${total!==0?fmtSeg(total,chart.cur):'—'}</span>
          </div>
        </div>`;
      }).join('');
    } else {
      const maxV=Math.max(...sTotals,0.001);
      rowsHtml=sTeams.map((team,i)=>{
        const total=sTotals[i];
        const segsHtml=chart.segments.map(seg=>{
          const v=segVal(team,seg,chart);
          if(v<=0)return'';
          const pct=v/maxV*100;
          const lblColor=seg.dark===false?'rgba(30,45,84,.8)':'#fff';
          const showLbl=pct>9;
          return`<div class="chart-seg" style="width:${pct.toFixed(2)}%;background:${seg.color}" data-tip="${seg.label}: ${fmtSeg(v,chart.cur)}">${showLbl?`<span class="chart-seg-lbl" style="color:${lblColor}">${fmtSeg(v,chart.cur)}</span>`:''}</div>`;
        }).join('');
        return`<div class="chart-row">
          <div class="chart-team-lbl" title="${team}">${team}</div>
          <div class="chart-bar-area">
            <div class="chart-track">${segsHtml}</div>
            <span class="chart-total">${total>0?fmtSeg(total,chart.cur):'—'}</span>
          </div>
        </div>`;
      }).join('');
    }

    return`<div class="chart-card${chart.wide?' chart-card-wide':''}">
      <div class="chart-title">${chart.label}</div>
      ${legendHtml}
      ${rowsHtml}
    </div>`;
  }

  const mesPillsE=mesList.length>1?`<div class="mes-bar" style="margin-bottom:14px">
    <span class="team-label">Período</span>
    ${mesList.map(m=>`<button class="pill ${selectedMes===m?'active':''}" onclick="selectMes('${m}')">${m}</button>`).join('')}
  </div>`:'';

  panel.innerHTML=mesPillsE+`<div class="chart-grid">${CHARTS.map(renderChart).join('')}</div>`;
}

// ── painel por assessor ───────────────────────────
function selectAssessor(cod){selectedAssessor=cod;buildAssessor()}

function toggleProductsA(id){
  const row=document.querySelector(`tr[data-id="a_${id}"]`);if(!row)return;
  const isOpen=row.classList.contains('open-p');
  document.querySelectorAll(`tr[data-parent="a_${id}"]`).forEach(r=>{
    r.classList.toggle('hidden',isOpen);
    if(isOpen){r.classList.remove('open-p');const cid=r.dataset.id?.slice(2);if(cid)document.querySelectorAll(`tr[data-parent="a_${cid}"]`).forEach(s=>s.classList.add('hidden'));}
  });
  row.classList.toggle('open-p',!isOpen);
}

function buildAssessor(){
  const panel=document.getElementById('panel-assessor');
  const hasMes=mesList.length>0;
  const available=allData
    .filter(r=>(!hasMes||r.mes===selectedMes)&&(currentRole==='ALL'||r.equipe===currentRole)&&r.nome)
    .sort((a,b)=>a.equipe.localeCompare(b.equipe)||a.nome.localeCompare(b.nome));

  if(!available.length){panel.innerHTML='<div class="placeholder">Nenhum assessor disponível</div>';return;}
  if(!selectedAssessor||!available.find(r=>r.cod===selectedAssessor))selectedAssessor=available[0].cod;
  const a=available.find(r=>r.cod===selectedAssessor);
  if(!a){panel.innerHTML='<div class="placeholder">Assessor não encontrado</div>';return;}

  const pace=calcPace();
  const pm=produtoMeta;
  const KPIS_A=[
    {id:'capLiq',label:'Captação Líquida',val:a.capLiq,meta:a.metaCapLiq||null,cur:true,dtColuna:'Cap. Liq. Total',
     children:[
      {id:'capPF',label:'Cap. Líq. PF',val:a.capPF,meta:a.metaCapPF||null,cur:true},
      {id:'capPJ',label:'Cap. Líq. PJ',val:a.capPJ,meta:a.metaCapPJ||null,cur:true,children:[
        {id:'pme',label:'PME',val:a.pme,cur:true},
        {id:'corp',label:'Corporate',val:a.corp,cur:true},
      ]},
    ]},
    {id:'auc',label:'AUC',val:a.netEmM,meta:null,cur:true,dtColuna:'Net Em M'},
    {id:'aPF',label:'Ativações PF',val:a.aPF,meta:a.metaAtivPF300k||null,cur:false,proj:true,dtColuna:'Ativação PF',children:[
      {id:'a3p',label:'PF 300k+',val:a.a3p,meta:a.metaAtivPF300k||null,cur:false,proj:true},
      {id:'a3m',label:'PF 300k-',val:a.a3m,meta:null,cur:false,proj:true},
    ]},
    {id:'aPJ',label:'Ativações PJ',val:a.aPJ,meta:a.metaAtivPJ300k||null,cur:false,proj:true,dtColuna:'Ativação PJ',children:[
      {id:'a3pPJ',label:'PJ 300k+',val:a.a3pPJ,meta:a.metaAtivPJ300k||null,cur:false,proj:true},
      {id:'a3mPJ',label:'PJ 300k-',val:a.a3mPJ,meta:null,cur:false,proj:true},
    ]},
    {id:'receita',label:'Receita Total',val:a.recCalc,meta:null,cur:true,proj:true,dtColuna:'Receita Renda Fixa',children:[
      {id:'rRF', label:'Renda Fixa',    val:a.rRF, meta:pm['Renda Fixa']   ||null,cur:true,proj:true},
      {id:'rRV', label:'Renda Variável',val:a.rRV, meta:pm['Renda Variável']||null,cur:true,proj:true},
      {id:'rCet',label:'Cetipados',     val:a.rCet,meta:pm['Cetipados']    ||null,cur:true,proj:true},
      {id:'rCOE',label:'COE',           val:a.rCOE,meta:pm['COE']          ||null,cur:true,proj:true},
      {id:'rInt',label:'Internacional', val:a.rInt,meta:pm['Internacional'] ||null,cur:true,proj:true},
      {id:'rFun',label:'Fundos',        val:a.rFun,meta:pm['Fundos']        ||null,cur:true,proj:true},
      {id:'rPrev',label:'Previdência',  val:a.rPrev,meta:pm['Previdência']  ||null,cur:true,proj:true},
      {id:'rFee',label:'Fee Fixo',      val:a.rFee,meta:pm['Fee Fixo']      ||null,cur:true,proj:true},
      {id:'rCam',label:'Câmbio',        val:a.rCam,meta:pm['Câmbio']        ||null,cur:true,proj:true},
    ]},
    {id:'seguros',label:'PA Seguros',val:a.apolEm,meta:a.metaPASeg||null,cur:true,proj:true,dtColuna:'R1 Seguros',children:[
      {id:'r1',label:'R1 — Reuniões',val:a.r1,meta:a.metaR1||null,cur:false,proj:true},
      {id:'r2',label:'R2 — Reuniões',val:a.r2,meta:a.metaR2||null,cur:false,proj:true},
    ]},
    {id:'feCons', label:'Consórcio — Fechamentos',val:a.feCons, meta:a.metaCons  ||null,cur:true,proj:true, dtColuna:'Fechamento Consórcio'},
    {id:'modServ',label:'Modelo de Servir',       val:a.modServ,meta:a.metaModServ||null,cur:false,dtColuna:'Modelo de Servir'},
    {id:'saude',  label:'Saúde do Cliente',       val:a.saude,  meta:a.metaSaude ||null,cur:false,dtColuna:'Saúde do Cliente'},
    {id:'rupt',   label:'Ruptura',                val:a.rupt,   meta:a.metaRupt  ||null,cur:false,dtColuna:'Clientes em Ruptura',invertBad:true},
    {id:'nps',    label:'NPS Respondidos',        val:a.npsResp,meta:a.metaNPS   ||null,cur:false,dtColuna:'NPS Respondidos'},
  ];

  function mkR0(kpi){
    const hasC=!!(kpi.children?.length);
    const c=cells(kpi.val,kpi.meta||null,kpi.cur,kpi.invertBad||false,pace.pct,kpi.proj||false);
    const dt=kpi.dtColuna?(dateMap[kpi.dtColuna]||''):'';
    const click=hasC?`onclick="toggleProductsA('${kpi.id}')"`:''
    return`<tr class="r0 ${c.heatCls}" data-id="a_${kpi.id}" ${click} style="${c.p!==null?`--w:${c.pw}%`:''}">
      <td><div class="lbl">
        ${hasC?`<span class="chev-p" onclick="event.stopPropagation();toggleProductsA('${kpi.id}')">▶</span>`:`<span style="width:14px;display:inline-block"></span>`}
        <span class="kname">${kpi.label}</span>
      </div></td>
      <td class="dt-cell">${dt}</td>
      <td class="vn ${c.vnCls}">${c.display}</td>
      <td class="meta-cell">${c.metaDisplay}</td>
      <td class="pct-cell ${c.pc}">${c.pctTxt}</td>
      <td class="proj-cell ${c.projCls}">${c.projTxt}</td>
    </tr>`;
  }
  function mkR1(child,pid){
    const hasC=!!(child.children?.length);
    const c=cells(child.val,child.meta||null,child.cur,false,pace.pct,child.proj||false);
    const click=hasC?`onclick="toggleProductsA('${child.id}')"`:''
    return`<tr class="r1 hidden ${c.heatCls}" data-id="a_${child.id}" data-parent="a_${pid}" ${click} style="${c.p!==null?`--w:${c.pw}%`:''}">
      <td><div class="lbl">
        ${hasC?`<span class="chev-p" onclick="event.stopPropagation();toggleProductsA('${child.id}')">▶</span>`:`<span style="width:14px;display:inline-block"></span>`}
        <span class="sname">${child.label}</span>
      </div></td>
      <td class="dt-cell"></td>
      <td class="vn ${c.vnCls}">${c.display}</td>
      <td class="meta-cell">${c.metaDisplay}</td>
      <td class="pct-cell ${c.pc}">${c.pctTxt}</td>
      <td class="proj-cell ${c.projCls}">${c.projTxt}</td>
    </tr>`;
  }
  function mkR2(child2,pid){
    const c=cells(child2.val,null,child2.cur,false,pace.pct,false);
    return`<tr class="r2 hidden" data-id="a_${child2.id}" data-parent="a_${pid}">
      <td><div class="lbl"><span style="width:14px;display:inline-block"></span><span class="ssname">${child2.label}</span></div></td>
      <td class="dt-cell"></td>
      <td class="vn ${c.vnCls}">${c.display}</td>
      <td class="meta-cell">—</td><td class="pct-cell"></td><td class="proj-cell"></td>
    </tr>`;
  }

  let tbody='';
  for(const kpi of KPIS_A){
    tbody+=mkR0(kpi);
    if(kpi.children?.length){
      for(const ch of kpi.children){
        tbody+=mkR1(ch,kpi.id);
        if(ch.children?.length)for(const c2 of ch.children)tbody+=mkR2(c2,ch.id);
      }
    }
  }

  // selector: grouped by team
  const byTeam={};
  available.forEach(r=>{if(!byTeam[r.equipe])byTeam[r.equipe]=[];byTeam[r.equipe].push(r);});
  const optGroups=Object.keys(byTeam).sort().map(eq=>`<optgroup label="${eq}">${byTeam[eq].map(r=>`<option value="${r.cod}"${r.cod===selectedAssessor?' selected':''}>${r.nome}</option>`).join('')}</optgroup>`).join('');
  const mesPillsA=mesList.length>1?`<div class="mes-bar">
    <span class="team-label">Período</span>
    ${mesList.map(m=>`<button class="pill ${selectedMes===m?'active':''}" onclick="selectMes('${m}')">${m}</button>`).join('')}
  </div>`:'' ;

  panel.innerHTML=`
  ${mesPillsA}
  <div class="assessor-bar">
    <span class="team-label">Assessor</span>
    <select class="asel" onchange="selectAssessor(this.value)">${optGroups}</select>
    <span class="a-badge">${a.equipe}</span>
    ${a.cod?`<span class="a-badge" style="color:var(--tx3)">${a.cod}</span>`:''}
  </div>
  <div class="table-wrap">
    <table class="kt">
      <thead><tr>
        <th>Indicador</th>
        <th class="c" style="width:84px">Atualização</th>
        <th class="r" style="width:110px">Realizado</th>
        <th class="r" style="width:100px">Meta</th>
        <th class="c" style="width:58px">% Meta</th>
        <th class="c" style="width:80px;white-space:nowrap">Projeção</th>
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

async function init(){
  // tooltip interativo para gráficos
  const tip=document.createElement('div');tip.id='k3tip';document.body.appendChild(tip);
  document.addEventListener('mousemove',e=>{
    const el=e.target.closest('[data-tip]');
    if(el){
      tip.textContent=el.dataset.tip;
      tip.style.display='block';
      tip.style.left=e.clientX+'px';
      tip.style.top=e.clientY+'px';
    }else{
      tip.style.display='none';
    }
  });
  document.addEventListener('mouseleave',()=>{tip.style.display='none';},{capture:true});

  showLoginOverlay();
  const s=getSession();
  if(s)applySession(s.role); // sessão existente: oculta overlay e renderiza
  await loadData();           // carrega dados (re-renderiza se já autenticado)
}
init();
</script>
</body>
</html>
